<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>雷霆战机 · THUNDER FIGHTER</title>
<style>
/* ===================== 基础布局 ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 8%,#0a1a34 0%,#050a16 48%,#000 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  color:#dff4ff;overflow:hidden;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* ===================== 机台画面 ===================== */
.stage{
  position:relative;
  width:min(480px,100vw,60vh);
  aspect-ratio:3/5;
  border-radius:12px;
  overflow:hidden;
  background:#04060f;
  touch-action:none;
  box-shadow:0 0 0 1px rgba(90,200,255,.28),0 0 44px rgba(40,140,255,.30),0 24px 70px rgba(0,0,0,.75);
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 扫描线质感 */
.scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:overlay;
}
/* ===================== HUD ===================== */
.hud{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;
  font-variant-numeric:tabular-nums;
}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-block{display:flex;flex-direction:column;gap:2px}
.hud-block.right{text-align:right}
.hud-label{font-size:11px;letter-spacing:2px;color:#6fb6d8;text-shadow:0 0 8px rgba(0,180,255,.6)}
.hud-value{
  font-size:22px;font-weight:800;letter-spacing:1px;color:#c8f4ff;
  text-shadow:0 0 12px rgba(80,210,255,.9),0 0 26px rgba(40,140,255,.55);
  line-height:1;
}
.hud-value.small{font-size:14px;font-weight:700;color:#8fc9e6;letter-spacing:0}
.hud-stage{
  position:absolute;left:50%;top:36px;transform:translateX(-50%);
  font-size:12px;letter-spacing:5px;color:#ffd166;opacity:.9;
  text-shadow:0 0 12px rgba(255,180,60,.75);
}
.hud-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hud-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.icons{display:flex;gap:4px}
.icon-ship{
  width:12px;height:15px;
  background:linear-gradient(180deg,#9ef0ff,#2a9bff);
  clip-path:polygon(50% 0%,100% 72%,50% 56%,0% 72%);
  filter:drop-shadow(0 0 5px rgba(80,200,255,.9));
}
.icon-bomb{
  width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff6c2,#ffb03a 55%,#c85a00);
  box-shadow:0 0 8px rgba(255,160,40,.9);
}
.power-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.power-bar{display:flex;gap:3px}
.power-seg{width:11px;height:6px;border-radius:2px;background:rgba(90,160,200,.28);border:1px solid rgba(90,190,255,.28)}
.power-seg.on{background:linear-gradient(90deg,#4de6ff,#7cffb2);box-shadow:0 0 8px rgba(90,240,255,.95);border-color:rgba(140,255,255,.9)}
/* ===================== 遮罩层 ===================== */
.overlay{
  position:absolute;inset:0;z-index:6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:26px;text-align:center;
  background:rgba(3,8,20,.82);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.overlay.hidden{display:none}
.title{
  font-size:44px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(180deg,#ffffff,#8fe8ff 45%,#2f8bff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(60,190,255,.85));
  animation:titleGlow 2.4s ease-in-out infinite;
}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 14px rgba(60,190,255,.7))}50%{filter:drop-shadow(0 0 26px rgba(60,190,255,1))}}
.subtitle{font-size:11px;letter-spacing:7px;color:#5fa7c8;margin-top:-8px}
.divider{width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(90,200,255,.6),transparent)}
.tips{font-size:12.5px;line-height:2;color:#93c6dc;letter-spacing:.5px}
.tips b{color:#ffd166;font-weight:700}
.btn{
  pointer-events:auto;cursor:pointer;
  margin-top:4px;padding:12px 42px;border-radius:8px;
  font-size:15px;font-weight:800;letter-spacing:4px;color:#dff8ff;
  background:linear-gradient(180deg,rgba(40,150,255,.26),rgba(20,70,140,.32));
  border:1px solid rgba(110,220,255,.75);
  box-shadow:0 0 18px rgba(60,170,255,.45),inset 0 0 20px rgba(60,170,255,.25);
  transition:transform .12s,box-shadow .12s,background .12s;
  font-family:inherit;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(90,210,255,.75),inset 0 0 26px rgba(90,210,255,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border-color:rgba(120,190,230,.4);box-shadow:none;font-size:13px;padding:9px 26px}
.over-score{display:flex;gap:34px;margin:4px 0}
.over-score div{display:flex;flex-direction:column;gap:6px}
.over-score span{font-size:11px;letter-spacing:3px;color:#6fb6d8}
.over-score strong{font-size:30px;color:#ffd166;text-shadow:0 0 16px rgba(255,180,60,.8);font-variant-numeric:tabular-nums}
.over-title{font-size:30px;font-weight:900;letter-spacing:6px;color:#ff5c7a;text-shadow:0 0 20px rgba(255,80,110,.8)}
.pause-title{font-size:26px;font-weight:800;letter-spacing:6px;color:#9fe8ff;text-shadow:0 0 18px rgba(80,210,255,.8)}
/* 手机端提示 */
@media (pointer:coarse){
  .tips .pc{display:none}
}
</style>
</head>
<body>
<div class="stage" id="stageEl">
  <canvas id="cv"></canvas>
  <div class="scanlines"></div>

  <!-- ================= HUD ================= -->
  <div class="hud">
    <div class="hud-top">
      <div class="hud-block">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="uiScore">0</div>
      </div>
      <div class="hud-block right">
        <div class="hud-label">BEST</div>
        <div class="hud-value small" id="uiBest">0</div>
      </div>
    </div>
    <div class="hud-stage" id="uiStage">STAGE 1</div>
    <div class="hud-bottom">
      <div>
        <div class="hud-row"><div class="hud-label">LIFE</div><div class="icons" id="uiLives"></div></div>
        <div class="hud-row"><div class="hud-label">BOMB</div><div class="icons" id="uiBombs"></div></div>
      </div>
      <div class="power-wrap">
        <div class="hud-label">POWER</div>
        <div class="power-bar" id="uiPower"></div>
      </div>
    </div>
  </div>

  <!-- ================= 开始界面 ================= -->
  <div class="overlay" id="screenStart">
    <div class="title">雷霆战机</div>
    <div class="subtitle">THUNDER FIGHTER</div>
    <div class="divider"></div>
    <div class="tips">
      <b class="pc">W A S D / 方向键</b><span class="pc"> 移动 · </span><span class="pc"><b>鼠标拖拽</b> 也能操控</span>
      <br>自动开火 · <b>J</b> 释放炸弹 · <b>P</b> 暂停
      <br>吃 <b>P</b> 升级火力 · <b>S</b> 获得护盾 · <b>B</b> 补充炸弹
    </div>
    <button class="btn" id="btnStart">开 始 游 戏</button>
  </div>

  <!-- ================= 暂停界面 ================= -->
  <div class="overlay hidden" id="screenPause">
    <div class="pause-title">暂 停</div>
    <div class="tips">按 <b>P</b> 或点击按钮继续</div>
    <button class="btn" id="btnResume">继 续 游 戏</button>
    <button class="btn ghost" id="btnQuit">重新开始</button>
  </div>

  <!-- ================= 结束界面 ================= -->
  <div class="overlay hidden" id="screenOver">
    <div class="over-title">任 务 失 败</div>
    <div class="over-score">
      <div><span>本局得分</span><strong id="uiFinal">0</strong></div>
      <div><span>最高纪录</span><strong id="uiFinalBest">0</strong></div>
    </div>
    <div class="tips">抵达 <b id="uiFinalStage">STAGE 1</b></div>
    <button class="btn" id="btnRetry">再 来 一 局</button>
  </div>
</div>

<script>
"use strict";
(function () {

/* ============================================================
   0. 常量与工具
   ============================================================ */
const VW = 480;          // 逻辑宽（设计分辨率）
const VH = 800;          // 逻辑高

const rnd  = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;

function dist2(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy;
}
function hitCircle(a, b) {
  const r = a.r + b.r;
  return dist2(a, b) < r * r;
}

/* ============================================================
   1. 画布与自适应
   ============================================================ */
const stageEl = document.getElementById('stageEl');
const canvas  = document.getElementById('cv');
const ctx     = canvas.getContext('2d');

let dpr = 1;
let viewScale = 1;   // 物理像素 -> 逻辑像素

function resize() {
  const rect = stageEl.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(rect.width  * dpr);
  canvas.height = Math.round(rect.height * dpr);
  viewScale = canvas.width / VW;
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.lineJoin = 'round';
}
resize();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

/* ============================================================
   2. 音效（WebAudio 合成，无外部资源）
   ============================================================ */
let AC = null;
let muted = false;

function audioCtx() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}

function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  const ac = audioCtx(); if (!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.01);
}

function noiseBurst(dur = 0.28, vol = 0.14) {
  if (muted) return;
  const ac = audioCtx(); if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const k = 1 - i / n;
    data[i] = (Math.random() * 2 - 1) * k * k;
  }
  const src = ac.createBufferSource();
  src.buffer = buf;
  const g = ac.createGain();
  g.gain.value = vol;
  src.connect(g); g.connect(ac.destination);
  src.start();
}

/* ============================================================
   3. 全局状态
   ============================================================ */
const G = {
  state: 'menu',        // menu | playing | paused | over
  time: 0,
  stage: 1,
  stageTime: 0,
  score: 0,
  best: Number(localStorage.getItem('thunder_best') || 0),
  shake: 0,
  flash: 0,
  clearTimer: 0,        // 关卡过渡计时
  warning: 0,           // BOSS 警告倒计时
  bossSpawned: false,
  nextStageFlag: false,
  spawnTimer: 1,
};

const player = {
  x: VW / 2, y: VH - 110,
  r: 11,
  speed: 330,
  power: 1,
  maxPower: 4,
  lives: 3,
  bombs: 3,
  invuln: 0,
  shield: 0,
  fireTimer: 0,
  tilt: 0,
  flash: 0,
};

const bullets   = [];   // 玩家子弹
const ebullets  = [];   // 敌方子弹
const enemies   = [];
const particles = [];
const powerups  = [];
const shocks    = [];   // 冲击波圆环
let boss = null;

/* ============================================================
   4. 星空背景
   ============================================================ */
const stars = [];
(function initStars() {
  for (let i = 0; i < 160; i++) {
    stars.push({
      x: rnd(0, VW), y: rnd(0, VH),
      z: rnd(0.15, 1),
      r: rnd(0.5, 1.9),
      warm: Math.random() < 0.22,
    });
  }
})();

const nebulas = [
  { x: 110, y: 300, r: 230, hue: 205, sp: 22 },
  { x: 370, y: 620, r: 190, hue: 268, sp: 16 },
];

function updateStars(dt) {
  const spd = G.state === 'playing' ? 1 : 0.45;
  for (const s of stars) {
    s.y += (50 + s.z * 300) * dt * spd;
    if (s.y > VH + 4) { s.y -= VH + 8; s.x = rnd(0, VW); }
  }
}

function drawBackground() {
  // 深空底色
  const bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#070f22');
  bg.addColorStop(0.55, '#04070f');
  bg.addColorStop(1, '#02040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, VW, VH);

  // 星云光斑
  for (const n of nebulas) {
    const y = ((n.y + G.time * n.sp) % (VH + 700)) - 350;
    const rg = ctx.createRadialGradient(n.x, y, 0, n.x, y, n.r);
    rg.addColorStop(0, `hsla(${n.hue},85%,58%,0.16)`);
    rg.addColorStop(0.55, `hsla(${n.hue},80%,48%,0.06)`);
    rg.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(n.x, y, n.r, 0, TAU); ctx.fill();
  }

  // 星点
  for (const s of stars) {
    const a = 0.22 + s.z * 0.78;
    ctx.fillStyle = s.warm ? `rgba(255,226,180,${a})` : `rgba(210,240,255,${a})`;
    ctx.fillRect(s.x, s.y, s.r, s.r * (1 + s.z * 2.4));
  }
}

/* ============================================================
   5. 粒子 / 冲击波
   ============================================================ */
function spawnParticle(x, y, opt = {}) {
  particles.push({
    x, y,
    vx: opt.vx !== undefined ? opt.vx : rnd(-1, 1) * 60,
    vy: opt.vy !== undefined ? opt.vy : rnd(-1, 1) * 60,
    life: opt.life || rnd(0.25, 0.6),
    max: 0,
    size: opt.size || rnd(1.5, 3.5),
    color: opt.color || 'rgba(255,200,120,',
    drag: opt.drag === undefined ? 0.92 : opt.drag,
  });
  particles[particles.length - 1].max = particles[particles.length - 1].life;
}

function explosion(x, y, colors = ['rgba(255,214,130,', 'rgba(255,120,60,', 'rgba(255,255,255,'], count = 18, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = rnd(0, TAU);
    const sp = rnd(40, 210) * power;
    spawnParticle(x, y, {
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      size: rnd(1.4, 3.8) * power,
      life: rnd(0.25, 0.65),
      color: colors[i % colors.length],
    });
  }
  shocks.push({ x, y, r: 1, max: rnd(26, 46) * power, life: 0.32, t: 0.32, color: 'rgba(255,220,160,' });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const k = Math.pow(0.9, dt * 60);
    p.vx *= k; p.vy *= k;
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i];
    s.life -= dt;
    if (s.life <= 0) { shocks.splice(i, 1); continue; }
    const t = 1 - s.life / s.t;
    s.r = s.max * (0.15 + t * 0.95);
    s.alpha = (1 - t) * 0.65;
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
  }
  for (const s of shocks) {
    ctx.strokeStyle = s.color + (s.alpha || 0.3).toFixed(3) + ')';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke();
  }
}

/* ============================================================
   6. 玩家战机
   ============================================================ */
const keys = Object.create(null);
let pointer = { active: false, x: 0, y: 0 };

function playerFire() {
  const p = player;
  const y = p.y - 16;
  const mk = (offX, offY, vx, dmg) => bullets.push({
    x: p.x + offX, y: p.y + offY, vx: vx, vy: -660, r: 3.2, dmg: dmg,
  });

  if (p.power === 1) { mk(0, -14, 0, 1); }
  else if (p.power === 2) { mk(-8, -12, 0, 1); mk(8, -12, 0, 1); }
  else if (p.power === 3) { mk(0, -16, 0, 1.2); mk(-10, -10, 0, 1); mk(10, -10, 0, 1); }
  else { // 4 级：主炮 + 两侧直射 + 两侧斜射
    mk(0, -16, 0, 1.3);
    mk(-11, -8, 0, 1);
    mk(11, -8, 0, 1);
    mk(-16, -4, -190, 0.8);
    mk(16, -4,  190, 0.8);
  }

  // 枪口火花
  spawnParticle(p.x, p.y - 20, {
    vx: rnd(-18, 18), vy: rnd(-40, -10), life: 0.12, size: 2,
    color: 'rgba(150,235,255,', drag: 0.5,
  });

  beep(880 + p.power * 60, 0.05, 'square', 0.022, -140);
}

function updatePlayer(dt) {
  const p = player;

  if (p.invuln > 0) p.invuln -= dt;
  if (p.shield > 0) p.shield -= dt;
  if (p.flash > 0) p.flash -= dt;

  // ---- 键盘控制 ----
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    p.x += (dx / len) * p.speed * dt;
    p.y += (dy / len) * p.speed * dt;
    p.tilt += (dx * 0.22 - p.tilt) * Math.min(1, dt * 10);
  } else {
    p.tilt += (0 - p.tilt) * Math.min(1, dt * 8);
  }

  // ---- 指针拖拽控制 ----
  if (pointer.active) {
    const nx = clamp(pointer.x, 16, VW - 16);
    const ny = clamp(pointer.y - 26, 50, VH - 24);
    p.tilt += ((nx - p.x) * 0.04 - p.tilt) * Math.min(1, dt * 10);
    p.x += (nx - p.x) * Math.min(1, dt * 18);
    p.y += (ny - p.y) * Math.min(1, dt * 18);
  }

  p.x = clamp(p.x, 16, VW - 16);
  p.y = clamp(p.y, 50, VH - 24);

  // ---- 自动开火 ----
  p.fireTimer -= dt;
  if (p.fireTimer <= 0) {
    p.fireTimer = 0.095;
    playerFire();
  }

  // 护盾光环粒子
  if (p.shield > 0 && Math.random() < dt * 10) {
    const a = rnd(0, TAU);
    spawnParticle(p.x + Math.cos(a) * 26, p.y + Math.sin(a) * 26, {
      vx: Math.cos(a) * 10, vy: Math.sin(a) * 10,
      life: 0.5, size: 1.6, color: 'rgba(120,255,220,', drag: 1,
    });
  }
}

function drawPlayer() {
  const p = player;
  const blink = p.invuln > 0 && Math.floor(G.time * 12) % 2 === 0;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt * 0.5);
  if (blink) ctx.globalAlpha = 0.4;

  // ---- 机身 ----
  const body = ctx.createLinearGradient(0, -20, 0, 16);
  body.addColorStop(0, '#eafcff');
  body.addColorStop(0.35, '#7fdcff');
  body.addColorStop(0.72, '#2a86e0');
  body.addColorStop(1, '#0e3d78');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(6, -6);
  ctx.lineTo(17, 6);
  ctx.lineTo(18, 13);
  ctx.lineTo(7, 10);
  ctx.lineTo(0, 15);
  ctx.lineTo(-7, 10);
  ctx.lineTo(-18, 13);
  ctx.lineTo(-17, 6);
  ctx.lineTo(-6, -6);
  ctx.closePath();
  ctx.fill();

  // 描边发光
  ctx.strokeStyle = 'rgba(150,240,255,0.9)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 机翼金色装饰
  ctx.strokeStyle = 'rgba(255,209,102,0.9)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-16, 7); ctx.lineTo(-7, 2);
  ctx.moveTo(16, 7);  ctx.lineTo(7, 2);
  ctx.stroke();

  // 座舱
  const cock = ctx.createLinearGradient(0, -12, 0, 2);
  cock.addColorStop(0, 'rgba(255,255,255,0.95)');
  cock.addColorStop(1, 'rgba(80,200,255,0.35)');
  ctx.fillStyle = cock;
  ctx.beginPath();
  ctx.ellipse(0, -5, 4.2, 8, 0, 0, TAU);
  ctx.fill();

  // ---- 引擎尾焰（加色混合，画在机身之后）----
  ctx.globalCompositeOperation = 'lighter';
  const len = 26 + Math.sin(G.time * 42) * 8;
  const flame = ctx.createLinearGradient(0, 6, 0, 6 + len);
  flame.addColorStop(0, 'rgba(255,255,255,1)');
  flame.addColorStop(0.22, 'rgba(150,240,255,0.95)');
  flame.addColorStop(0.6, 'rgba(60,170,255,0.5)');
  flame.addColorStop(1, 'rgba(20,60,255,0)');
  ctx.fillStyle = flame;
  ctx.beginPath();
  ctx.moveTo(-7.5, 6); ctx.lineTo(0, 6 + len); ctx.lineTo(7.5, 6);
  ctx.closePath(); ctx.fill();

  // 两侧小喷口
  ctx.fillStyle = 'rgba(120,220,255,0.55)';
  for (const sx of [-11, 11]) {
    ctx.beginPath();
    ctx.moveTo(sx - 2.6, 8); ctx.lineTo(sx, 8 + len * 0.5); ctx.lineTo(sx + 2.6, 8);
    ctx.closePath(); ctx.fill();
  }

  // 内焰高光
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(-2.8, 6); ctx.lineTo(0, 6 + len * 0.45); ctx.lineTo(2.8, 6);
  ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // ---- 护盾 ----
  if (p.shield > 0) {
    const a = 0.35 + Math.sin(G.time * 8) * 0.15;
    ctx.strokeStyle = `rgba(110,255,220,${a})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(180,255,245,${a * 0.7})`;
    ctx.beginPath(); ctx.arc(0, 0, 22, G.time * 2, G.time * 2 + 1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 22, G.time * 2 + Math.PI, G.time * 2 + Math.PI + 1.6); ctx.stroke();
  }

  ctx.restore();
}

/* ============================================================
   7. 敌人
   ============================================================ */
function addEnemy(type, x, y, extra = {}) {
  const e = {
    type, x, y, baseX: x, r: 13, hp: 3, maxHp: 3,
    vy: 100, vx: 0, t: rnd(0, 10), phase: rnd(0, TAU),
    fireTimer: rnd(0.5, 1.4), flash: 0, holdY: 0, score: 100,
    dropRate: 0.14, entering: true,
  };

  if (type === 'scout') {
    Object.assign(e, { r: 13, hp: 3, vy: 105 + G.stage * 10, score: 100, dropRate: 0.14 });
  } else if (type === 'dart') {
    Object.assign(e, { r: 11, hp: 2, vy: 190 + G.stage * 14, score: 150, dropRate: 0.12 });
  } else if (type === 'gunner') {
    Object.assign(e, { r: 16, hp: 7 + G.stage, vy: 78, score: 220, dropRate: 0.22, holdY: rnd(110, 210) });
  } else if (type === 'tank') {
    Object.assign(e, { r: 25, hp: 22 + G.stage * 6, vy: 58, score: 420, dropRate: 0.45, holdY: rnd(130, 190) });
  }

  Object.assign(e, extra);
  e.maxHp = e.hp;
  e.baseX = e.x;
  enemies.push(e);
  return e;
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    e.fireTimer -= dt;

    switch (e.type) {
      case 'scout':
        e.y += e.vy * dt;
        e.x = e.baseX + Math.sin(e.t * 2.4 + e.phase) * 28;
        break;

      case 'dart':
        e.y += e.vy * dt;
        e.x += e.vx * dt;
        break;

      case 'gunner':
        if (e.y >= e.holdY) {
          e.y = e.holdY;
          e.x = e.baseX + Math.sin(e.t * 1.4) * 36;
          if (e.fireTimer <= 0) {
            fireAimed(e.x, e.y + 12, 200 + G.stage * 8);
            e.fireTimer = Math.max(0.85, 1.6 - G.stage * 0.07);
          }
        } else {
          e.y += e.vy * dt;
        }
        break;

      case 'tank':
        if (e.y >= e.holdY) {
          e.y = e.holdY;
          if (e.fireTimer <= 0) {
            fireFan(e.x, e.y + 18, 5, 0.30, 160, '#ff7a3d');
            e.fireTimer = Math.max(1.2, 2.3 - G.stage * 0.1);
          }
        } else {
          e.y += e.vy * dt;
        }
        break;
    }

    // 出界回收
    if (e.y > VH + 70 || e.x < -80 || e.x > VW + 80) {
      enemies.splice(i, 1);
    }
  }
}

/* ---------- 敌人弹道生成 ---------- */
function eBullet(x, y, vx, vy, color = '#ffb04d', r = 5) {
  ebullets.push({ x, y, vx, vy, r, color });
}

function fireAimed(x, y, speed) {
  const a = Math.atan2(player.y - y, player.x - x);
  eBullet(x, y, Math.cos(a) * speed, Math.sin(a) * speed, '#ff5c7a', 5.5);
  beep(300, 0.12, 'sine', 0.03, -120);
}

function fireFan(x, y, n, step, speed, color = '#ffb04d') {
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + (i - (n - 1) / 2) * step;
    eBullet(x, y, Math.cos(a) * speed, Math.sin(a) * speed, color, 5.5);
  }
  beep(240, 0.14, 'sine', 0.035, -100);
}

function fireRing(x, y, n, speed, color = '#ff5ad0') {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + G.time * 0.2;
    eBullet(x, y, Math.cos(a) * speed, Math.sin(a) * speed, color, 5);
  }
  beep(180, 0.2, 'triangle', 0.04, -80);
}

/* ============================================================
   8. BOSS
   ============================================================ */
function createBoss() {
  const hp = 240 + (G.stage - 1) * 110;
  boss = {
    x: VW / 2, y: -150, r: 62,
    hp, maxHp: hp,
    t: 0, entering: true,
    attackT: 1.6, spiralT: 0, spiralA: 0.6, spiralDir: 1,
    flash: 0, phase: 1,
  };
  beep(70, 0.7, 'sawtooth', 0.09, 40);
  G.shake = 10;
}

function bossAttack(phase) {
  const b = boss;
  if (phase === 1) {
    fireFan(b.x, b.y + 34, 9, 0.2, 165);
    b.attackT = 1.35;
  } else if (phase === 2) {
    fireFan(b.x, b.y + 34, 7, 0.26, 180, '#ff9a3d');
    for (let i = -1; i <= 1; i++) {
      const a = Math.atan2(player.y - b.y, player.x - b.x) + i * 0.22;
      eBullet(b.x, b.y + 20, Math.cos(a) * 250, Math.sin(a) * 250, '#ff5c7a', 5.5);
    }
    b.attackT = 1.05;
    beep(280, 0.16, 'sine', 0.035, -140);
  } else {
    fireRing(b.x, b.y, 18, 200);
    fireFan(b.x, b.y + 34, 5, 0.38, 220, '#ffb04d');
    b.attackT = 0.9;
    // 召唤小兵
    if ((G.stage > 1 || b.hp < b.maxHp * 0.2) && Math.random() < 0.5) {
      addEnemy('scout', b.x - 60, 60, { vy: 90 });
      addEnemy('scout', b.x + 60, 60, { vy: 90 });
    }
  }
}

function updateBoss(dt) {
  if (!boss) return;
  const b = boss;
  b.t += dt;
  if (b.flash > 0) b.flash -= dt;

  if (b.entering) {
    b.y += 130 * dt;
    if (b.y >= 215) { b.y = 215; b.entering = false; b.attackT = 0.9; }
    return;
  }

  b.x = VW / 2 + Math.sin(b.t * 0.72) * 132;
  b.y = 217 + Math.sin(b.t * 1.7) * 12;

  const ratio = b.hp / b.maxHp;
  b.phase = ratio > 0.62 ? 1 : (ratio > 0.3 ? 2 : 3);

  b.attackT -= dt;
  if (b.attackT <= 0) bossAttack(b.phase);

  // 三阶段螺旋弹
  if (b.phase === 3) {
    b.spiralT += dt;
    if (b.spiralT > 0.11) {
      b.spiralT = 0;
      if (b.spiralA >= Math.PI - 0.55) b.spiralDir = -1;
      if (b.spiralA <= 0.55) b.spiralDir = 1;
      b.spiralA += b.spiralDir * 0.26;
      eBullet(b.x, b.y + 18, Math.cos(b.spiralA) * 200, Math.sin(b.spiralA) * 200, '#ff5ad0', 5);
    }
  }
}

function drawBoss() {
  if (!boss) return;
  const b = boss;
  const ratio = Math.max(0, b.hp / b.maxHp);

  ctx.save();
  ctx.translate(b.x, b.y);

  // 光晕
  const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 110);
  glow.addColorStop(0, 'rgba(255,90,110,0.28)');
  glow.addColorStop(1, 'rgba(255,90,110,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, 110, 0, TAU); ctx.fill();

  const flash = b.flash > 0 ? 0.55 : 0;

  // 主体外壳
  const body = ctx.createLinearGradient(0, -60, 0, 60);
  body.addColorStop(0, flash ? '#ffffff' : '#5c2230');
  body.addColorStop(0.5, flash ? '#ffd0d8' : '#a83347');
  body.addColorStop(1, '#3a1019');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -58);
  ctx.lineTo(34, -40);
  ctx.lineTo(72, -26);
  ctx.lineTo(88, 10);
  ctx.lineTo(58, 22);
  ctx.lineTo(44, 52);
  ctx.lineTo(0, 44);
  ctx.lineTo(-44, 52);
  ctx.lineTo(-58, 22);
  ctx.lineTo(-88, 10);
  ctx.lineTo(-72, -26);
  ctx.lineTo(-34, -40);
  ctx.closePath();
  ctx.fill();

  // 边缘光
  ctx.strokeStyle = 'rgba(255,140,150,0.85)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // 翼炮
  ctx.fillStyle = '#ffb04d';
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.roundRect(sx * 62 - 6, -6, 12, 26, 4);
    ctx.fill();
  }

  // 核心
  const core = ctx.createRadialGradient(0, 4, 2, 0, 4, 26);
  core.addColorStop(0, '#ffffff');
  core.addColorStop(0.35, '#ffd166');
  core.addColorStop(1, 'rgba(255,60,90,0.15)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 4, 26, 0, TAU); ctx.fill();

  const pulse = 0.5 + Math.sin(G.time * 6) * 0.5;
  ctx.strokeStyle = `rgba(255,255,255,${0.35 + pulse * 0.5})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 4, 17 + pulse * 4, 0, TAU); ctx.stroke();

  // 装甲纹路
  ctx.strokeStyle = 'rgba(255,180,140,0.45)';
  ctx.lineWidth = 1;
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sx * 16, -34); ctx.lineTo(sx * 40, -10); ctx.lineTo(sx * 30, 30);
    ctx.stroke();
  }

  ctx.restore();

  // ---- 顶部血条（入场动画结束后才显示）----
  if (b.entering) return;
  const barW = 300, barH = 9, barX = (VW - barW) / 2, barY = 112;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  hpGrad.addColorStop(0, '#ff3b5c');
  hpGrad.addColorStop(0.6, '#ff8a3d');
  hpGrad.addColorStop(1, '#ffd166');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(barX, barY, barW * ratio, barH);
  ctx.strokeStyle = 'rgba(255,150,120,0.85)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);
  ctx.fillStyle = 'rgba(255,225,200,0.9)';
  ctx.font = 'bold 10px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BOSS · 第 ' + G.stage + ' 关旗舰', VW / 2, barY + 22);
}

/* ============================================================
   9. 敌机绘制
   ============================================================ */
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const f = e.flash > 0 ? '#ffffff' : null;

    if (e.type === 'scout') {
      ctx.rotate(Math.sin(e.t * 2.4 + e.phase) * 0.12);
      const g = ctx.createLinearGradient(0, -14, 0, 14);
      g.addColorStop(0, f || '#ffb27a');
      g.addColorStop(0.5, f || '#ff6a3d');
      g.addColorStop(1, '#8f2a12');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(13, -6);
      ctx.lineTo(5, -10);
      ctx.lineTo(0, -4);
      ctx.lineTo(-5, -10);
      ctx.lineTo(-13, -6);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,130,0.75)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,180,0.9)';
      ctx.beginPath(); ctx.arc(0, -2, 2.6, 0, TAU); ctx.fill();

    } else if (e.type === 'dart') {
      ctx.rotate(Math.atan2(e.vy, e.vx) - Math.PI / 2);
      const g = ctx.createLinearGradient(0, -16, 0, 12);
      g.addColorStop(0, f || '#9ad8ff');
      g.addColorStop(1, '#173f6e');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 16);
      ctx.lineTo(9, -4);
      ctx.lineTo(3, -12);
      ctx.lineTo(-3, -12);
      ctx.lineTo(-9, -4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(150,220,255,0.8)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,90,90,0.95)';
      ctx.beginPath(); ctx.arc(0, 4, 3, 0, TAU); ctx.fill();

    } else if (e.type === 'gunner') {
      const g = ctx.createLinearGradient(0, -16, 0, 16);
      g.addColorStop(0, f || '#ffd166');
      g.addColorStop(0.55, f || '#e08a20');
      g.addColorStop(1, '#5c3208');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(-16, -14, 32, 28, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,140,0.8)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // 炮口
      ctx.fillStyle = '#ff6a3d';
      ctx.beginPath(); ctx.roundRect(-12, 8, 8, 10, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(4, 8, 8, 10, 3); ctx.fill();
      // 眼睛
      const eye = 0.5 + Math.sin(G.time * 5) * 0.5;
      ctx.fillStyle = `rgba(255,80,60,${0.55 + eye * 0.45})`;
      ctx.beginPath(); ctx.ellipse(0, -2, 7, 3.5, 0, 0, TAU); ctx.fill();

    } else if (e.type === 'tank') {
      const g = ctx.createLinearGradient(0, -24, 0, 24);
      g.addColorStop(0, f || '#c98dff');
      g.addColorStop(0.5, f || '#8b4bd6');
      g.addColorStop(1, '#2d1152');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(-24, -20, 48, 40, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(214,180,255,0.85)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      // 装甲
      ctx.fillStyle = 'rgba(40,12,70,0.9)';
      ctx.beginPath(); ctx.roundRect(-18, -14, 36, 10, 4); ctx.fill();
      // 核心
      const c = 0.5 + Math.sin(G.time * 4) * 0.5;
      ctx.fillStyle = `rgba(255,110,200,${0.6 + c * 0.4})`;
      ctx.beginPath(); ctx.arc(0, 8, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(0, 8, 2.4, 0, TAU); ctx.fill();
    }

    ctx.restore();

    // 血条（受伤后显示）
    if (e.hp < e.maxHp) {
      const w = Math.max(14, e.r * 1.6);
      const y = e.y - e.r - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - w / 2, y, w, 3);
      ctx.fillStyle = '#ff5c7a';
      ctx.fillRect(e.x - w / 2, y, w * (e.hp / e.maxHp), 3);
    }
  }
}

/* ============================================================
   10. 子弹
   ============================================================ */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > VW + 20) bullets.splice(i, 1);
  }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -40 || b.y > VH + 40 || b.x < -40 || b.x > VW + 40) ebullets.splice(i, 1);
  }
}

function drawBullets() {
  // 玩家子弹：拉长光柱
  for (const b of bullets) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    const g = ctx.createLinearGradient(0, -9, 0, 9);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.5, 'rgba(120,230,255,0.95)');
    g.addColorStop(1, 'rgba(60,140,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-2.4, -9, 4.8, 18, 2.4); ctx.fill();
    ctx.restore();
  }

  // 敌方子弹：光球
  for (const b of ebullets) {
    const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.4);
    rg.addColorStop(0, 'rgba(255,255,255,0.98)');
    rg.addColorStop(0.32, b.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
}

/* ============================================================
   11. 道具
   ============================================================ */
const POWERUP_STYLE = {
  P: { color: '#4df0ff', label: 'P' },
  B: { color: '#ffb04d', label: 'B' },
  S: { color: '#7cffb2', label: 'S' },
};

function dropPowerup(x, y, forceType) {
  const r = Math.random();
  let type = forceType;
  if (!type) {
    if (r < 0.72) type = 'P';
    else if (r < 0.92) type = 'B';
    else type = 'S';
  }
  powerups.push({ x, y, vy: 110, r: 11, type, t: 0 });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt;
    p.y += p.vy * dt;
    p.x += Math.sin(p.t * 3) * 20 * dt;

    if (p.y > VH + 30) { powerups.splice(i, 1); continue; }

    // 吸附：靠近玩家时被吸引
    const d = Math.hypot(player.x - p.x, player.y - p.y);
    if (d < 110) {
      p.x += (player.x - p.x) * dt * 4;
      p.y += (player.y - p.y) * dt * 4;
    }

    if (hitCircle(p, player) && player.invuln <= 0) {
      powerups.splice(i, 1);
      beep(880, 0.1, 'sine', 0.06, 400);
      if (p.type === 'P') {
        if (player.power < player.maxPower) { player.power++; }
        else { G.score += 300; }
      } else if (p.type === 'B') {
        player.bombs = Math.min(5, player.bombs + 1);
      } else {
        player.shield = 8;
      }
      for (let k = 0; k < 10; k++) {
        const a = rnd(0, TAU);
        spawnParticle(p.x, p.y, {
          vx: Math.cos(a) * 70, vy: Math.sin(a) * 70,
          life: 0.4, size: 2, color: 'rgba(160,255,230,',
        });
      }
    }
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const st = POWERUP_STYLE[p.type];
    const pulse = 1 + Math.sin(p.t * 8) * 0.12;

    const rg = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 22 * pulse);
    rg.addColorStop(0, st.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(p.x, p.y, 22 * pulse, 0, TAU); ctx.fill();

    ctx.strokeStyle = st.color;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10.5, 0, TAU); ctx.stroke();

    ctx.fillStyle = st.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 9, 0, TAU); ctx.fill();

    ctx.fillStyle = '#04121e';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(st.label, p.x, p.y + 0.5);
    ctx.textBaseline = 'alphabetic';
  }
}

/* ============================================================
   12. 碰撞检测
   ============================================================ */
function hitEnemy(e, dmg, hx, hy) {
  e.hp -= dmg;
  e.flash = 0.08;
  spawnParticle(hx, hy, { vx: rnd(-40, 40), vy: rnd(-50, 10), life: 0.2, size: 2, color: 'rgba(255,240,200,' });
  if (e.hp <= 0) {
    const idx = enemies.indexOf(e);
    if (idx >= 0) enemies.splice(idx, 1);
    G.score += e.score;
    explosion(e.x, e.y, ['rgba(255,214,130,', 'rgba(255,120,60,', 'rgba(255,255,255,'], e.type === 'tank' ? 30 : 16, e.type === 'tank' ? 1.4 : 1);
    noiseBurst(e.type === 'tank' ? 0.4 : 0.22, e.type === 'tank' ? 0.2 : 0.12);
    G.shake = Math.max(G.shake, e.type === 'tank' ? 9 : 4);
    if (Math.random() < e.dropRate) dropPowerup(e.x, e.y);
  }
}

function damagePlayer() {
  const p = player;
  if (p.invuln > 0) return;

  if (p.shield > 0) {
    p.shield = 0;
    p.invuln = 0.8;
    G.shake = 8;
    beep(520, 0.25, 'triangle', 0.06, -260);
    for (let i = 0; i < 16; i++) {
      const a = rnd(0, TAU);
      spawnParticle(p.x, p.y, { vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.45, size: 2.2, color: 'rgba(120,255,220,' });
    }
    return;
  }

  p.lives--;
  p.flash = 0.3;
  G.shake = 16;
  G.flash = 0.35;
  explosion(p.x, p.y, ['rgba(150,235,255,', 'rgba(255,255,255,', 'rgba(90,140,255,'], 28, 1.5);
  noiseBurst(0.45, 0.22);
  beep(180, 0.5, 'sawtooth', 0.07, -120);

  if (p.lives <= 0) {
    gameOver();
    return;
  }

  // 复活
  p.x = VW / 2; p.y = VH - 110;
  p.invuln = 2.4;
  p.power = Math.max(1, p.power - 1);
  p.fireTimer = 0.3;
  updateHUD(true);
}

function collide() {
  // 玩家子弹 vs 敌机
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let consumed = false;

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (hitCircle(b, e)) {
        hitEnemy(e, b.dmg, b.x, b.y);
        bullets.splice(i, 1);
        consumed = true;
        break;
      }
    }
    if (consumed) continue;

    // BOSS
    if (boss && !boss.entering && hitCircle(b, boss)) {
      boss.hp -= b.dmg;
      boss.flash = 0.06;
      spawnParticle(b.x, b.y, { vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.18, size: 1.8, color: 'rgba(255,240,200,' });
      bullets.splice(i, 1);
      if (boss.hp <= 0) killBoss();
    }
  }

  // 玩家子弹 vs 敌弹（可抵消，增加爽感）
  // 敌弹 vs 玩家 / 玩家机体
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (player.invuln <= 0 && hitCircle(b, player)) {
      ebullets.splice(i, 1);
      damagePlayer();
      continue;
    }
  }

  // 敌机撞机
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (player.invuln <= 0 && hitCircle(e, player)) {
      if (e.type === 'scout' || e.type === 'dart') {
        hitEnemy(e, 999, e.x, e.y);
      } else {
        e.hp -= 6;
        e.flash = 0.1;
        if (e.hp <= 0) hitEnemy(e, 999, e.x, e.y);
      }
      damagePlayer();
    }
  }

  // BOSS 机体碰撞
  if (boss && !boss.entering && player.invuln <= 0 && hitCircle(boss, player)) {
    damagePlayer();
  }
}

/* ============================================================
   13. 关卡进程
   ============================================================ */
function startStage() {
  G.stageTime = 0;
  G.spawnTimer = 0.9;
  G.bossSpawned = false;
  G.clearTimer = 0;
  G.nextStageFlag = false;
  G.warning = 0;
  updateHUD(true);
}

function spawnWave() {
  const st = G.stage;
  const pick = Math.random();

  if (pick < 0.34) {
    // V 字小队
    const n = 4 + Math.min(3, st);
    for (let i = 0; i < n; i++) {
      const cx = 100 + i * (VW - 200) / (n - 1);
      addEnemy('scout', cx, -40 - Math.abs(i - (n - 1) / 2) * 34, { phase: i * 0.7 });
    }
  } else if (pick < 0.58) {
    // 俯冲队
    const n = 2 + Math.min(2, st);
    for (let i = 0; i < n; i++) {
      const side = i % 2 === 0 ? 1 : -1;
      const x = side > 0 ? VW - 80 - i * 26 : 80 + i * 26;
      addEnemy('dart', x, -50 - i * 55, { vx: (VW / 2 - x) * 0.35, vy: 210 + st * 12 });
    }
  } else if (pick < 0.8) {
    // 炮台排
    const n = 2 + Math.min(2, Math.floor(st / 2));
    for (let i = 0; i < n; i++) {
      addEnemy('gunner', (VW / (n + 1)) * (i + 1), -60 - i * 40, { holdY: 100 + i * 34 });
    }
  } else {
    // 重甲坦克 + 护卫
    addEnemy('tank', rnd(120, VW - 120), -70, { holdY: rnd(120, 170) });
    addEnemy('scout', 70, -140, {});
    addEnemy('scout', VW - 70, -140, {});
  }
}

function spawnLogic(dt) {
  if (G.bossSpawned) return;

  // 关卡时间到 → BOSS
  if (G.stageTime > 26 + G.stage * 2) {
    G.bossSpawned = true;
    G.warning = 2.4;
    beep(120, 0.9, 'square', 0.05, 60);
    return;
  }

  G.spawnTimer -= dt;
  if (G.spawnTimer > 0) return;
  G.spawnTimer = Math.max(0.42, 1.15 - G.stage * 0.07 - G.stageTime * 0.012) * rnd(0.85, 1.2);
  spawnWave();
}

function killBoss() {
  G.score += 2000 * G.stage;
  G.shake = 26;
  G.flash = 0.6;
  explosion(boss.x, boss.y, ['rgba(255,214,130,', 'rgba(255,120,60,', 'rgba(255,255,255,'], 80, 2.2);
  noiseBurst(0.9, 0.3);
  beep(90, 0.8, 'sawtooth', 0.09, -40);
  ebullets.length = 0;
  boss = null;
  G.clearTimer = 3;
  G.nextStageFlag = true;
}

function nextStage() {
  G.stage++;
  startStage();
  beep(660, 0.25, 'sine', 0.06, 220);
}

/* ============================================================
   14. 炸弹
   ============================================================ */
function useBomb() {
  if (G.state !== 'playing' || G.clearTimer > 0) return;
  if (player.bombs <= 0) {
    beep(220, 0.12, 'square', 0.04, -60);
    return;
  }
  player.bombs--;
  G.flash = 0.75;
  G.shake = 22;
  updateHUD(true);

  noiseBurst(0.6, 0.26);
  beep(140, 0.7, 'sawtooth', 0.1, 220);

  // 清空敌弹
  for (const b of ebullets) {
    spawnParticle(b.x, b.y, { life: 0.3, size: 3, color: 'rgba(200,240,255,' });
  }
  ebullets.length = 0;

  // 全屏伤害
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 14;
    e.flash = 0.12;
    if (e.hp <= 0) hitEnemy(e, 999, e.x, e.y);
  }
  if (boss && !boss.entering) {
    boss.hp -= 26;
    boss.flash = 0.15;
    if (boss.hp <= 0) killBoss();
  }

  // 冲击波
  shocks.push({ x: player.x, y: player.y, r: 1, max: 620, life: 0.7, t: 0.7, color: 'rgba(120,220,255,' });
}

/* ============================================================
   15. HUD 与界面
   ============================================================ */
const $score = document.getElementById('uiScore');
const $best  = document.getElementById('uiBest');
const $stage = document.getElementById('uiStage');
const $lives = document.getElementById('uiLives');
const $bombs = document.getElementById('uiBombs');
const $power = document.getElementById('uiPower');

const hudCache = { score: -1, best: -1, stage: -1, lives: -1, bombs: -1, power: -1 };

function updateHUD(force) {
  if (force || hudCache.score !== G.score) {
    $score.textContent = G.score.toLocaleString();
    hudCache.score = G.score;
  }
  if (force || hudCache.best !== G.best) {
    $best.textContent = G.best.toLocaleString();
    hudCache.best = G.best;
  }
  if (force || hudCache.stage !== G.stage) {
    $stage.textContent = 'STAGE ' + G.stage;
    hudCache.stage = G.stage;
  }
  if (force || hudCache.lives !== player.lives) {
    $lives.innerHTML = '';
    for (let i = 0; i < player.lives; i++) {
      const d = document.createElement('div');
      d.className = 'icon-ship';
      $lives.appendChild(d);
    }
    hudCache.lives = player.lives;
  }
  if (force || hudCache.bombs !== player.bombs) {
    $bombs.innerHTML = '';
    for (let i = 0; i < player.bombs; i++) {
      const d = document.createElement('div');
      d.className = 'icon-bomb';
      $bombs.appendChild(d);
    }
    hudCache.bombs = player.bombs;
  }
  if (force || hudCache.power !== player.power) {
    $power.innerHTML = '';
    for (let i = 1; i <= player.maxPower; i++) {
      const d = document.createElement('div');
      d.className = 'power-seg' + (i <= player.power ? ' on' : '');
      $power.appendChild(d);
    }
    hudCache.power = player.power;
  }
}

const screens = {
  start: document.getElementById('screenStart'),
  pause: document.getElementById('screenPause'),
  over:  document.getElementById('screenOver'),
};
function hideScreens() {
  for (const k in screens) screens[k].classList.add('hidden');
}

/* ---------- 游戏流程 ---------- */
function resetGame() {
  G.score = 0;
  G.stage = 1;
  G.stageTime = 0;
  G.shake = 0;
  G.flash = 0;
  G.clearTimer = 0;
  G.warning = 0;
  G.bossSpawned = false;
  G.nextStageFlag = false;

  bullets.length = 0;
  ebullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  powerups.length = 0;
  shocks.length = 0;
  boss = null;

  Object.assign(player, {
    x: VW / 2, y: VH - 110, power: 1, lives: 3, bombs: 3,
    invuln: 1.8, shield: 0, fireTimer: 0, tilt: 0, flash: 0,
  });
  pointer.active = false;
  updateHUD(true);
}

function startGame() {
  audioCtx();
  resetGame();
  G.state = 'playing';
  G.spawnTimer = 0.9;
  hideScreens();
}

function gameOver() {
  G.state = 'over';
  G.best = Math.max(G.best, G.score);
  localStorage.setItem('thunder_best', String(G.best));
  document.getElementById('uiFinal').textContent = G.score.toLocaleString();
  document.getElementById('uiFinalBest').textContent = G.best.toLocaleString();
  document.getElementById('uiFinalStage').textContent = 'STAGE ' + G.stage;
  updateHUD(true);
  screens.over.classList.remove('hidden');
}

function togglePause() {
  if (G.state === 'playing') {
    G.state = 'paused';
    pointer.active = false;
    screens.pause.classList.remove('hidden');
  } else if (G.state === 'paused') {
    G.state = 'playing';
    screens.pause.classList.add('hidden');
  }
}

/* ============================================================
   16. 输入
   ============================================================ */
document.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;

  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();

  if (e.key === 'Enter' || e.key === ' ') {
    if (G.state === 'menu' || G.state === 'over') { startGame(); return; }
  }
  if (k === 'p' || e.key === 'Escape') { togglePause(); }
  if (k === 'j' || k === 'x' || k === 'control') { useBomb(); }
  if (k === 'm') {
    muted = !muted;
    G.flash = 0.12;
  }
});

document.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});

// 失焦自动暂停
window.addEventListener('blur', () => {
  keys && Object.keys(keys).forEach((k) => (keys[k] = false));
  if (G.state === 'playing') togglePause();
});

/* ---------- 指针 ---------- */
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((e.clientX - r.left) / r.width) * VW,
    y: ((e.clientY - r.top) / r.height) * VH,
  };
}

stageEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button')) return;
  if (G.state !== 'playing') return;
  audioCtx();
  pointer.active = true;
  const p = pointerPos(e);
  pointer.x = p.x; pointer.y = p.y;
  stageEl.setPointerCapture && stageEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});

stageEl.addEventListener('pointermove', (e) => {
  if (!pointer.active) return;
  const p = pointerPos(e);
  pointer.x = p.x; pointer.y = p.y;
  e.preventDefault();
});

function endPointer() {
  pointer.active = false;
}
stageEl.addEventListener('pointerup', endPointer);
stageEl.addEventListener('pointercancel', endPointer);
stageEl.addEventListener('pointerleave', endPointer);

// 右键 / 双击炸弹（手机端双击也可以用）
stageEl.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- 界面按钮 ---------- */
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRetry').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', togglePause);
document.getElementById('btnQuit').addEventListener('click', () => {
  G.state = 'menu';
  resetGame();
  hideScreens();
  screens.start.classList.remove('hidden');
});

/* ============================================================
   17. 主循环
   ============================================================ */
function update(dt) {
  G.time += dt;
  updateStars(dt);
  updateParticles(dt);

  if (G.state === 'playing') {
    if (G.clearTimer > 0) {
      G.clearTimer -= dt;
      if (G.clearTimer <= 0 && G.nextStageFlag) nextStage();
    }

    if (G.warning > 0) {
      G.warning -= dt;
      if (G.warning <= 0 && !boss) createBoss();
    }

    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateEBulletsPos(dt);
    updatePowerups(dt);
    updateBoss(dt);
    collide();

    G.stageTime += dt;
    if (G.clearTimer <= 0) spawnLogic(dt);

    // 清理已消灭的 BOSS 引用
    if (boss && boss.hp <= 0) boss = null;
  }

  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 46);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.8);
}

// 敌弹位置在 updateBullets 中已更新，这里只做兜底（保持接口清晰）
function updateEBulletsPos() {}

function drawWorldText() {
  ctx.textAlign = 'center';

  // BOSS 警告
  if (G.warning > 0) {
    const blink = Math.floor(G.time * 6) % 2 === 0;
    if (blink) {
      ctx.fillStyle = 'rgba(255,60,90,0.9)';
      ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
      ctx.fillText('WARNING', VW / 2, VH / 2 - 40);
      ctx.fillStyle = 'rgba(255,180,120,0.9)';
      ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
      ctx.fillText('敌 方 旗 舰 接 近 中', VW / 2, VH / 2 + 6);
    }
  }

  // 关卡过关
  if (G.clearTimer > 0 && G.nextStageFlag) {
    const a = clamp(G.clearTimer / 3, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#9fe8ff';
    ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
    ctx.fillText('STAGE CLEAR', VW / 2, VH / 2 - 10);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
    ctx.fillText('第 ' + G.stage + ' 关 突 破', VW / 2, VH / 2 + 26);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function render() {
  ctx.save();
  if (G.shake > 0.5) {
    ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  }

  drawBackground();
  drawPowerups();
  drawEnemies();
  drawBoss();
  drawBullets();
  if (G.state !== 'menu') drawPlayer();
  else drawMenuShip();
  drawParticles();
  drawWorldText();

  ctx.restore();

  // 全屏闪光
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(200,240,255,${Math.min(0.85, G.flash)})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 顶部渐暗（衬托 HUD）
  const topGrad = ctx.createLinearGradient(0, 0, 0, 90);
  topGrad.addColorStop(0, 'rgba(2,6,14,0.75)');
  topGrad.addColorStop(1, 'rgba(2,6,14,0)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, VW, 90);
}

// 主菜单的展示机体
function drawMenuShip() {
  player.x = VW / 2 + Math.sin(G.time * 1.1) * 46;
  player.y = VH - 130 + Math.sin(G.time * 1.7) * 10;
  player.tilt = Math.cos(G.time * 1.1) * 0.15;
  drawPlayer();
}

let lastT = 0;
function loop(now) {
  if (!lastT) lastT = now;
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  update(dt);
  render();
  updateHUD(false);

  requestAnimationFrame(loop);
}

/* ============================================================
   18. 启动
   ============================================================ */
updateHUD(true);
requestAnimationFrame(loop);

})();
</script>
